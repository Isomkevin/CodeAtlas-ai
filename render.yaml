# Render Blueprint: provisions the CodeAtlas backend on Render's free tier.
# Neo4j is not included because Render has no managed Neo4j; use Neo4j Aura Free
# and fill in CODEATLAS_NEO4J_* below.
#
# Deploy: New + -> Blueprint -> connect this repository -> apply.
# Docs: docs/06-operations/production-deployment.md

databases:
  - name: codeatlas-postgres
    plan: free
    databaseName: codeatlas
    user: codeatlas
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: keyvalue
    name: codeatlas-redis
    plan: free
    ipAllowList: []

  - type: web
    name: codeatlas-api
    runtime: docker
    plan: free
    branch: main
    rootDir: .
    dockerfilePath: ./docker/Dockerfile.api
    healthCheckPath: /api/v1/ready
    autoDeploy: true
    envVars:
      - key: CODEATLAS_ENVIRONMENT
        value: production
      - key: CODEATLAS_RUN_MIGRATIONS
        value: "1"
      - key: CODEATLAS_RUN_INLINE_WORKER
        value: "1"
      - key: CODEATLAS_LOG_LEVEL
        value: INFO
      - key: CODEATLAS_ALLOW_DEVELOPMENT_LOGIN
        value: "false"
      - key: CODEATLAS_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: CODEATLAS_JWT_ISSUER
        value: codeatlas
      - key: CODEATLAS_JWT_AUDIENCE
        value: codeatlas-web
      - key: CODEATLAS_AI_BASE_URL
        value: https://api.openai.com/v1
      - key: CODEATLAS_AI_MODEL
        value: gpt-4.1-mini

      # Datastores wired from the managed services above.
      - key: CODEATLAS_DATABASE_URL
        fromDatabase:
          name: codeatlas-postgres
          property: connectionString
      - key: CODEATLAS_REDIS_URL
        fromService:
          type: keyvalue
          name: codeatlas-redis
          property: connectionString

      # Random secret generated by Render on first apply.
      - key: CODEATLAS_JWT_SECRET
        generateValue: true

      # Origin of the deployed Vercel frontend. Set after apply.
      # Example: https://code-atlas-ai-henna.vercel.app
      - key: CODEATLAS_WEB_APP_ORIGIN
        sync: false
      # JSON array of allowed browser origins (no trailing slash).
      # Example: ["https://code-atlas-ai-henna.vercel.app"]
      - key: CODEATLAS_ALLOWED_ORIGINS
        sync: false

      # Neo4j Aura Free instance (neo4j+s://...).
      - key: CODEATLAS_NEO4J_URI
        sync: false
      - key: CODEATLAS_NEO4J_USERNAME
        value: neo4j
      - key: CODEATLAS_NEO4J_PASSWORD
        sync: false

      # GitHub OAuth App + webhook.
      # Callback: https://<this-service>.onrender.com/api/v1/auth/github/callback
      - key: CODEATLAS_GITHUB_CLIENT_ID
        sync: false
      - key: CODEATLAS_GITHUB_CLIENT_SECRET
        sync: false
      - key: CODEATLAS_GITHUB_OAUTH_REDIRECT_URI
        sync: false
      - key: CODEATLAS_GITHUB_WEBHOOK_SECRET
        sync: false

      # Fernet keys (base64 url-safe 32-byte). Generate locally and paste:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: CODEATLAS_GITHUB_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: CODEATLAS_AI_KEY_ENCRYPTION_KEY
        sync: false

      # OpenAI API key for AI-enhanced chat. Optional; without it CodeAtlas
      # falls back to deterministic graph-backed answers.
      - key: CODEATLAS_AI_API_KEY
        sync: false
