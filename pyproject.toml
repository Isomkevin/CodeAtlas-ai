[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codeatlas-api"
version = "0.1.0"
description = "CodeAtlas Architecture Intelligence Platform API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "celery[redis]>=5.4,<6.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "neo4j>=5.28,<6.0",
  "opentelemetry-api>=1.29,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1.0",
  "opentelemetry-sdk>=1.29,<2.0",
  "prometheus-client>=0.21,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "structlog>=24.4,<26.0",
  "tree-sitter>=0.25,<1.0",
  "tree-sitter-javascript>=0.23,<1.0",
  "tree-sitter-typescript>=0.23,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--strict-markers --cov=app --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.coverage.run]
branch = true
source = ["backend/app"]
